spring:
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/rag
logging:
  level:
    root: INFO
    org.hibernate.orm.jdbc.batch: TRACE
  file:
    name: logs/rag.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        temp.use_jdbc_metadata_defaults: true
        jdbc:
          fetch_size: 50
  liquibase:
    change-log: classpath:/db/db.changelog-master.xml
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    function:
      definition: consumeProduct;consumeStock
    stream:
      bindings:
        consumeProduct-in-0:
          destination: catalog.public.outbox
          group: rag-catalog
          consumer:
            concurrency: 3
            start-offset: latest
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              java.lang.ClassCastException: false
        consumeStock-in-0:
          destination: inventory.public.outbox
          group: rag-inventory
          consumer:
            concurrency: 3
            start-offset: latest
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              java.lang.ClassCastException: false
      kafka:
        bindings:
          consumeProduct-in-0:
            consumer:
              enable-dlq: true
              dlq-name: rag.catalog.outbox.dlq
          consumeStock-in-0:
            consumer:
              enable-dlq: true
              dlq-name: rag.inventory.outbox.dlq
        binder:
          brokers: localhost:29092
          auto-create-topics: true
          min-partition-count: 3
          replication-factor: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/nexus
  ai:
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: nexus-products
        initialize-schema: true
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: qwen3-embedding:8b
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-admin:discovery-secure-password@localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30