nexus:
  messaging:
    bindings:
      publish: publishProduct-out-0
outbox:
  cron: "0/5 * * * * *"
  batch-size: 30
  max-retries: 5
  archive:
    cron: "0 0 2 * * *"
    threshold-days: 30
    batch-size: 500
server:
  port: 8081
spring:
  threads:
    virtual:
      enabled: true
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
        id:
          optimizer:
            pooled:
              preferred: pooled-lo
  springdoc:
    writer-with-json-view: true
    model-and-view-allowed: true
    show-actuator: false
    default-consumes-media-type: application/json
    default-produces-media-type: application/json
    group-configs:
      - group: 'Catalog API'
        paths-to-match: /v1/**
    open-api:
      info:
        title: "Nexus Catalog"
        version: "v1"
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, metrics, prometheus, loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    metrics:
      enabled: true
  observations:
    key-values:
      application: project-nexus