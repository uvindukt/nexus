server:
  port: 8089

# Reusable filter definitions (plain YAML anchors — parsed before Spring binds properties,
# so this works with any YAML-backed config, not a Spring-specific feature).
x-retry-filter: &retry-filter
  name: Retry
  args:
    retries: 1
    methods: GET
    series: SERVER_ERROR
    backoff:
      firstBackoff: 50ms
      maxBackoff: 500ms
      factor: 2

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin
          routes:
            - id: catalog-service
              uri: lb://catalog
              predicates:
                - Path=/catalog/v1/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /catalog/(?<segment>.*)
                    replacement: /$\{segment}
                - name: CircuitBreaker
                  args:
                    name: catalogServiceCB
                    fallbackUri: forward:/fallback/catalog
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - *retry-filter

            - id: inventory-service
              uri: lb://inventory
              predicates:
                - Path=/inventory/v1/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /inventory/(?<segment>.*)
                    replacement: /$\{segment}
                - name: CircuitBreaker
                  args:
                    name: inventoryServiceCB
                    fallbackUri: forward:/fallback/inventory
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@userKeyResolver}"
                - *retry-filter

            - id: rag-service
              uri: lb://rag
              predicates:
                - Path=/rag/v1/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /rag/(?<segment>.*)
                    replacement: /$\{segment}
                - name: CircuitBreaker
                  args:
                    name: ragServiceCB
                    fallbackUri: forward:/fallback/rag
                # RAG calls hit an LLM — tighter, separate bucket so it can't starve other routes
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"
                - *retry-filter

            - id: analytics-service
              uri: lb://analytics
              predicates:
                - Path=/analytics/v1/**
              metadata:
                # SSE connections stay open indefinitely — the global 5s response-timeout
                # would kill the stream almost immediately, so this route overrides it.
                # Verify against your Spring Cloud Gateway version that this is honored;
                # if not, the fallback is a very large explicit value rather than -1.
                response-timeout: -1
                connect-timeout: 2000
              filters:
                - name: RewritePath
                  args:
                    regexp: /analytics/(?<segment>.*)
                    replacement: /$\{segment}
                - name: RequestRateLimiter
                  args:
                    # Gates new connection attempts, not in-stream traffic — SSE connections
                    # are long-lived, so this bounds how many clients can start streaming per window.
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:8080/realms/nexus}

# Resilience4j circuit breaker + timeout config, referenced by name above
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      catalogServiceCB:
        baseConfig: default
      inventoryServiceCB:
        baseConfig: default
      ragServiceCB:
        baseConfig: default
        # RAG calls are slower and more failure-prone (LLM round trips) — more tolerant window
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
    instances:
      ragServiceCB:
        timeoutDuration: 15s   # LLM calls need more room than a plain CRUD service

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, circuitbreakers, circuitbreakerevents
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-admin:discovery-secure-password@localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    org.springframework.cloud.gateway: DEBUG